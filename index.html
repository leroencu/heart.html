# heart.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Красные надписи */
        .small-text {
            position: absolute;
            color: #ff1a1a;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            /* Мягкое размытие как на фото */
            text-shadow: 0 0 4px rgba(255, 0, 0, 0.9), 0 0 10px rgba(255, 0, 0, 0.4);
            filter: blur(0.5px);
            transition: opacity 0.5s ease-in-out;
        }

        /* Белая надпись */
        .center-text {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 75px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            text-align: center;
            white-space: nowrap;
            z-index: 100;
            /* Белое свечение + лёгкое размытие */
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 25px rgba(255, 255, 255, 0.4);
            filter: blur(0.8px);
            transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="center-text" class="center-text">I love you</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const centerTextEl = document.getElementById('center-text');

        const width = window.innerWidth;
        const height = window.innerHeight;
        const centerX = width / 2;
        const centerY = height / 2;
        const scale = Math.min(width, height) / 24;

        const elements = [];
        const points = [];

        // Проверка: находится ли точка внутри сердца
        function isInsideHeart(x, y) {
            let nx = (x - centerX) / scale;
            let ny = -(y - centerY) / scale;
            let a = nx * nx + ny * ny - 1;
            let formula = a * a * a - nx * nx * ny * ny * ny;
            return formula <= 0;
        }

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;

        // Заполняем всю площадь сердца
        const step = 16; 
        for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
                let px = x + (Math.random() - 0.5) * step;
                let py = y + (Math.random() - 0.5) * step;

                if (isInsideHeart(px, py)) {
                    points.push({ x: px, y: py });
                    
                    if (px < minX) minX = px;
                    if (px > maxX) maxX = px;
                    if (py < minY) minY = py;
                    if (py > maxY) maxY = py;
                }
            }
        }

        // Центр сердца
        const heartCenterX = (minX + maxX) / 2;
        const heartCenterY = (minY + maxY) / 2;

        // Сортируем точки по углу — надписи появляются последовательно по кругу
        points.sort((a, b) => {
            const angleA = Math.atan2(a.y - heartCenterY, a.x - heartCenterX);
            const angleB = Math.atan2(b.y - heartCenterY, b.x - heartCenterX);
            return angleA - angleB;
        });

        // Создаём надписи
        points.forEach((p, index) => {
            const span = document.createElement('span');
            span.className = 'small-text';
            span.innerText = 'I love you';

            span.style.left = p.x + 'px';
            span.style.top = p.y + 'px';

            // Задержка появления: волна по кругу
            const delay = index * 0.01; 
            span.style.transitionDelay = delay + 's';

            container.appendChild(span);
            elements.push(span);
        });

        // Позиция белой надписи — чуть выше центра сердца
        centerTextEl.style.left = heartCenterX + 'px';
        centerTextEl.style.top = (heartCenterY - 45) + 'px';

        // Запуск появления красных надписей
        setTimeout(() => {
            elements.forEach(el => {
                el.style.opacity = '1';
            });
        }, 100);

        // Через 15 секунд появляется белая надпись
        setTimeout(() => {
            centerTextEl.style.opacity = '1';
        }, 15000);
    </script>
</body>
</html>
