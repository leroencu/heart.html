# heart.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .small-text {
            position: absolute;
            color: #ff1a1a;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 4px rgba(255, 0, 0, 0.9), 0 0 10px rgba(255, 0, 0, 0.4);
            filter: blur(0.6px);
            transition: opacity 0.3s ease-in-out;
        }

        .center-text {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 75px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            text-align: center;
            white-space: nowrap;
            z-index: 100;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 25px rgba(255, 255, 255, 0.4);
            filter: blur(0.8px);
            transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="center-text" class="center-text">I love you</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const centerTextEl = document.getElementById('center-text');

        const width = window.innerWidth;
        const height = window.innerHeight;
        const centerX = width / 2;
        const centerY = height / 2;
        const scale = Math.min(width, height) / 24;

        const elements = [];
        const points = [];

        // Количество точек по контуру
        const totalPoints = 300;

        // Проходим по контуру сердца по формуле
        for (let i = 0; i < totalPoints; i++) {
            // t от 0 до 2PI — полный обход контура
            let t = (i / totalPoints) * Math.PI * 2;
            
            // Формула сердца (контур)
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

            // Позиция на экране
            let posX = centerX + x * scale;
            let posY = centerY - y * scale;

            points.push({ x: posX, y: posY });
        }

        // Сортируем точки так, чтобы обход начинался с верхней точки и шёл по контуру
        // Найдём верхнюю точку (минимальный Y) и отсортируем по углу от неё
        const topPointIndex = points.reduce((minIdx, p, idx, arr) => 
            p.y < arr[minIdx].y ? idx : minIdx, 0);

        // Переставляем массив, начиная с верхней точки
        const sortedPoints = [
            ...points.slice(topPointIndex),
            ...points.slice(0, topPointIndex)
        ];

        // Создаём надписи с задержкой появления
        const totalTime = 15000; // 15 секунд на обход всего контура
        const delayPerPoint = totalTime / sortedPoints.length;

        sortedPoints.forEach((p, index) => {
            const span = document.createElement('span');
            span.className = 'small-text';
            span.innerText = 'I love you';

            span.style.left = p.x + 'px';
            span.style.top = p.y + 'px';

            // Задержка появления по очереди
            const delay = index * (delayPerPoint / 1000);
            span.style.transitionDelay = delay + 's';

            container.appendChild(span);
            elements.push(span);
        });

        // Центр сердца (для белой надписи)
        const heartCenterX = centerX;
        const heartCenterY = centerY - 20;

        centerTextEl.style.left = heartCenterX + 'px';
        centerTextEl.style.top = heartCenterY + 'px';

        // Запуск появления красных надписей
        setTimeout(() => {
            elements.forEach(el => {
                el.style.opacity = '1';
            });
        }, 100);

        // Через 15 секунд появляется белая надпись
        setTimeout(() => {
            centerTextEl.style.opacity = '1';
        }, 15000);
    </script>
</body>
</html>
